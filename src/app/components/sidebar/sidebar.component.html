<aside class="sidebar glass-panel" [class.open]="isOpen" [class.closed]="!isOpen">
  <div class="brand">
    <div class="brand-logo-css">
      <div class="logo-main">
        <div class="logo-word">Spazio</div>
        <div class="logo-word offset">Vitale</div>
      </div>
    </div>
  </div>
  <nav class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <span>🏠 Dashboard</span>
    </a>
    <a routerLink="/quotations" routerLinkActive="active" class="nav-item">
      <span>📄 Cotizaciones</span>
    </a>
    <a routerLink="/price-list" routerLinkActive="active" class="nav-item">
      <span>💰 Lista de Precios</span>
    </a>
    <a *ngIf="authService.getUser()?.role === 'admin'" routerLink="/activity" routerLinkActive="active" class="nav-item">
      <span>📋 Actividad</span>
    </a>
    <!-- Solo admin ve configuración -->
    <a *ngIf="authService.getUser()?.role === 'admin'" routerLink="/settings" routerLinkActive="active" class="nav-item">
      <span>⚙️ Configuración</span>
    </a>

    <!-- SECCIÓN TEMPORALES -->
    <div class="nav-section-title" *ngIf="temporals.length > 0" style="padding: 10px 20px; font-size: 0.8em; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px;">
      Temporales
    </div>
    <a *ngFor="let t of temporals" (click)="resumeTemporal(t._id!)" class="nav-item temporal-item" style="cursor: pointer; position: relative; padding-right: 40px;">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">💾 {{ t.clientName }}</span>
        <span style="font-size: 0.7em; color: #a1a1aa; margin-left: 20px;">Paso: {{ t.currentStepName }}</span>
      </div>
      <button class="btn-icon text-error" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8em;" (click)="deleteTemporal(t._id!, $event)" title="Descartar borrador">🗑️</button>
    </a>

  </nav>
  <div class="logout-container" style="display: flex; justify-content: center; padding-bottom: 20px;">
    <button class="btn-danger" style="width: 90%;" (click)="logout()">
      <span>🚪 Cerrar Sesión</span>
    </button>
  </div>
</aside>
